1.1.2:
  notes: "[mms] SECURITY: Fix CSS vulnerability when viewing file data (found by nightmare.lmw@anarchynet.org).\n[jan] Add Japanese translation (Hiromi Kimura <hiromi@tac.tsukuba.ac.jp>).\n"
1.1.1:
  notes: "[jan] Add Croatian translation (Valentin Vidic <valentin.vidic@carnet.hr>).\n[mms] Upgrade prototype.js to v1.6.1.\n[mms] Fix create folder dialog in IE (Bug #8216).\n[jan] Don't redirect to browse view if viewing a file fails.\n"
1.1.0:
  notes: "Original version string was 1.1\n[jan] Fix attachment dialog with only a single autologin backend (Bug #7096).\n[jan] Start with first page again when filter string is changed (Bug #7935).\n[mms] Navigation link now uses description from backends.php (Request #8037, Thomas Reifferscheid <thomas@reifferscheid.org>).\n[mjr] Fix issue that was causing the wrong backend to be selected when being redirected to login.php.\n[mms] Fix autologin when switching backends on login page (Bug #7892, horde@smartsector.hu).\n"
1.1.0-RC1:
  notes: "Original version string was 1.1-RC1\n[mms] Add folder caching.\n[mms] Add pager navigation and filtering (Request #7160, joel@scopserv.com).\n[jan] Add Estonian translation (Alar Sing <alar.sing@err.ee>).\n[jan] Add Basque translation (Euskal Herriko Unibertsitatea EHU/UPV <xabier.arrieta@ehu.es>).\n[cjh] Use the Horde date_format preference (Bug #6683).\n[cjh] Apply fix for http://dev.rubyonrails.org/ticket/11473 to prototype.js (Request #6590).\n[jan] Add Turkish translation (METU <horde-tr@metu.edu.tr>).\n[cjh] If the VFS backend supports streams, use them to avoid reading entire files into memory when downloading (Request #5913).\n[mms] Compress download data.\n[jan] Add Ukrainian translation (Andriy Kopystyansky <anri@polynet.lviv.ua>).\n[bak] Add browse API to allow browsing backends through WebDAV (Request #5337).\n[cjh] Inline PHP-generated javascript to avoid cross-domain leaking (Bug #5307).\n[mms] Preserve URL anchor information when performing login.\n[mms] All javascript now contained in static, cacheable files.\n[cjh] Add javascript sortable tables to Gollem.\n[cjh] Use optimized Horde_Template code as Gollem_Template.\n[cjh] Fix javascript errors when filenames contain quotes (Bug #3824), and make several links work without JavaScript.\n[jan] Add editing of text files.\n[mms] Add examples/checks for SSH2 VFS driver.\n"
1.0.4:
  notes: "[jan] Add Estonian translation (Alar Sing <alar.sing@err.ee>).\n[jan] Add Basque translation (Euskal Herriko Unibertsitatea EHU/UPV <xabier.arrieta@ehu.es>).\n[jan] Add Slovak translation (Martin Matuška <martin@matuska.org>).\n[cjh] Fix uploading files to non-empty directories when deletion is disabled (Bug #5349).\n"
1.0.3:
  notes: "[jan] Add Catalan translation (Jordi Giralt <projecte.k2@upcnet.es>).\n[jan] Add Slovenian translation (Duck <duck@obala.net>).\n[jan] Add Brazilian Portuguese translation (Fábio Gomes <flgoms@uol.com.br>).\n[mms] Don't show quota link in menu if quota support for current backend is disabled.\n"
1.0.2:
  notes: "[jan] Add Danish translation (Brian Truelsen <horde+i18n@briantruelsen.dk>).\n[mms] Allow admin to disable clipboard support in backends.php.\n[mms] Allow direct autologin from login page if there are no additional login parameters available (Bug #3299, jpolansky@lsit.ucsb.edu).\n[mms] Fix displaying/loading wrong backend when changing backends via the dropdown on login page (Bug #3298, jpolansky@lsit.ucsb.edu).\n"
1.0.2-RC1:
  notes: "[mms] Convert all page templates to Horde_Template.\n[mms] Add row highlighting to manager page (Bug #2977).\n[mms] Fix configtabs in configuration file (Bug #3119).\n"
1.0.1:
  notes: "[mms] Don't try to login using Horde auth credentials if hordeauth is off (Bug #3078).\n[mms] Can select default permissions for newly created files and directories per backend.\n"
1.0.1-RC1:
  notes: "[mms] Indicate if no backends are available to a user.\n[mms] Add quota status page (Bug #2685).\n[mms] Add interface to facilitate admins in editing permissions on a per-backend basis (Bug #2255, vijay.mahrra@es.easynet.net).\n[mms] Add support for VFS quota checking (Bug #162).\n[mms] Fix autocreation of home directories when home is also the root directory (Bug #2603).\n[mms] Add language selection to login screen if using gollem as the authentication driver.\n[mms] Add 'redirect_on_logout' and 'alternate_login' config parameters.\n[mms] Work around bug in VFS's autocreatePath() occuring in Horde <= 3.0.4.\n[jan] Add Polish translation (Krzysztof Kozlowski <kozik1@o2.pl>).\n"
1.0.0:
  notes: "Original version string was 1.0\n[mms] Move filter parameter in backends.php from the VFS 'params' array to the driver's base level.\n[mms] Home should default to root, not the base directory, if it is undefined.\n[mms] Pass configuration error messages to the login screen on aborted login.\n"
1.0.0-RC2:
  notes: "Original version string was 1.0-RC2\n[mms] Allow home directory to be autocreated on login if it doesn't exist.\n[mms] Added ability to copy/cut between VFS backends.\n[mms] Added clipboard screen.\n[jan] Add Hungarian translation (Laszlo L. Tornoci <torlasz@xenia.sote.hu>).\n"
1.0.0-RC1:
  notes: "Original version string was 1.0-RC1\n[mms] Exit back to login screen if autologin attempt fails.\n[mms] Fix logins when either 'home' or 'root' is a relative path.\n[mms] Skip login screen if there are no loginparams required.\n[mms] Add 'driver' and 'dir' parameters to download/view links so that these links are not tied to the current session.\n[jan] Add Finnish translation (Leena Heino <leena.heino@uta.fi>).\n"
1.0.0-BETA1:
  notes: "Original version string was 1.0-BETA\n[mms] Consolidated template code to reduce the number of included files needed per page load.\n[mms] Added realPath() function to Gollem:: to lower minimum Horde requirement from 3.0.5 to 3.0.\n"
1.0.0-ALPHA1:
  notes: "Original version string was 1.0-ALPHA\n[mas] Change any output of <b> and <i> tags to <strong> and <em> for better accessibility support.\n[mms] Remove 'change_server' and 'change_port' configuration parameters and instead allow admin to choose which VFS parameters can be overriden by the user at login time via the backend configuration.\n[mms] Honor the Horde-wide 'redirect_on_logout' and 'alternate_login' configuration parameters.\n[jan] Add Latvian translation (Janis Eisaks <jancs@dv.lv>).\n[mms] Tweaks to make sure 'root' isn't a required parameter (Bug #1663).\n[mms] Allow changing folders using relative paths (Bug #1585).\n[mms] Automatically generate new upload fields on demand.\n[mms] Allow user to switch between multiple backends during a single session.\n[mms] Add backend selection to the left tree sidebar.\n[jan] Allow to switch backends in select file popup window.\n[cjh] Consistently use Folder, not Directory (Benoit St-Andre <ben@benoitst-andre.net>).\n[cjh] Fix loading of an extra frameset on login screen reloads.\n[mms] Add API for other Horde applications to show a file dialog to select and return files.\n[jan] Add regular expression filters for directory listings (Peter Arien <Peter.Arien@cc.kuleuven.ac.be>).\n[cjh] Add recursive deletion of directories (Jeff Graves <jeff@image-src.com>).\n[mms] Only support viewing one backend at a time now.\n[mms] Encrypt passwords in session.\n[mms] Moved all session creation code to Gollem_Session::.\n[cjh] Enforce all permissions for backends if they are set (Amith Varghese <amith@xalan.com>).\n[mms] Added test script.\n[mms] Allow up to three files to be uploaded at once.\n[cjh] View files in a new window, allowing viewing of types that we don't allow inline display of.\n[cjh] Copy/Paste files functionality (Michael Varghese <mike.varghese@ascellatech.com>).\n[max] Fix 'hordeauth' is set to true, but the realm not getting stripped from the username.\n[cjh] Add preferences for which columns to display (Liam Hoekenga <liamr@umich.edu>).\n[jan] Add Romanian translation (Eugen Hoanca <eugenh@urban-grafx.ro>).\n[cjh] Display the total size of files in a directory (Tero Matinlassi <tero.matinlassi@edu.vantaa.fi>).\n[cjh] Add move/copy between different backends (j.huinink@wanadoo.nl).\n[cjh] Add ability to view different backends side-by-side (j.huinink@wanadoo.nl).\n[cjh] Add Move/Copy functionality (Michael Varghese <mike.varghese@ascellatech.com>).\n[cjh] Preference for showing/hiding .dotfiles (Liam Hoekenga <liamr@umich.edu>).\n[cjh] Put download links in a separate column. Having the filename sometimes mean view and sometimes mean download was very confusing.\n[cjh] Add support for 'home' parameter in backend configuration (Liam Hoekenga <liamr@umich.edu>).\n[cjh] Add Change Directory menu item (Liam Hoekenga <liamr@umich.edu>).\n[jan] Add Bulgarian translation (Miroslav Pendev <pendev@hotmail.com>).\n[cjh] If 'hordeauth' is set to 'full', usernames will not be stripped of anything after the first @ when doing Horde authentication.\n[mac] Use MIME_Viewers to display filetypes we recognize.\n[cjh] Make the server list more dynamic; automatically log users in when they select a server that doesn't require any more credentials, and reload the form when they change servers to make sure the fields are accurate.\n[mac] Allow users to select an FTP server (if the admin allows) and add a server list again.\n[mac] Add conf.xml.\n[cjh] Gollem is now completely based on the VFS backend system. Thanks to Michael Varghese <mike.varghese@ascellatech.com>.\n[jan] Add Norwegian Nynorsk translation (Per-Stian Vatne <psv@orsta.org>).\n[cjh] Close a potential problem with register_globals On and $js_onLoad.\n[cjh] Respect show_dotfiles settings in servers.php (Marcus I. Ryan <marcus@riboflavin.net>).\n[cjh] Use the new PrefsUI class.\n[jon] Adapt to the new Horde::img() syntax.\n[cjh] Use passive mode.\n[cjh] Switch output compression to ob_gzhandler().\n[cjh] Prefix all application constants with GOLLEM_.\n[cjh] Use the new Notification system.\n[cjh] Use GOLLEM_TEMPLATES constant for all template paths.\n[cjh] Use $registry->get() for all Registry information.\n[jan] Add Swedish translation (Andreas Dahlén <andreas@dahlen.ws>).\n[jan] Remove the standard value for the language preference. The language to fall back to should be set Horde wide in lang.php instead.\n[jan] Add Korean translation (J.I Kim <aporie@netian.com>).\n[cjh] Nuke forwards/vacation/password stuff; Gollem is a file manager.\n[cjh] Remove server/port preferences.\n[bjn] Change 'en' and 'en_EN' locales to 'en_US' (default).\n[cjh] Add French translation (Remi@Cohen-Scali.com).\n[cjh] Take framework updates into account.\n[jan] Add Russian translation (Anton Nekhoroshih <anton@valuehost.ru>).\n[jan] Add German translation.\n[jan] Add Italian translation (Giovanni Meneghetti <gmeneghetti@infvic.it>).\n[cjh] Chmod now works (Anton Nekhoroshih <anton@valuehost.ru>).\n[cjh] Add Traditional Chinese translation (David Chang <david@thbuo.gov.tw>).\n[cjh] Add Czech translation (pchytil@asp.ogi.edu).\n[avsm] Replace $conf['paths'] with the $registry equivalents.\n[cjh] Add $conf['menu']['apps'] support.\n[cjh] Add translation framework.\n[cjh] Start to handle symlinks correctly.\n[cjh] Fix problem going up to home directory.\n[cjh] Use prefs.gif and generic prefs templates from Horde.\n[jon] Merge doctype.inc into common-header.inc.\n[jon] Allow the registry to handle Gollem's configuration values.\n[jon] HORDE_BASE is now defined in lib/base.php instead of config/conf.php.\n[max] Rename MOTD.html to motd.php, and move to a .dist file.\n[max] Add the realm field to make logins unique on multi-server configurations for preferences and authentication.\n[max] Allow Gollem to be an authentication handler for Horde.\n[cjh] Define the HORDE_BASE constant in config/conf.php, and use it when referring to any of Horde's files.\n[max] Remove connection tracking, made obsolete by redirect.ph